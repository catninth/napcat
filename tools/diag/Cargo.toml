[package]
name = "napcat-diag"
version = "0.1.0"
edition = "2021"
description = "Diagnosztika: HID interfészek és Bluetooth akkuszintek listázása"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_IO",
    "Win32_System_Threading",
]
